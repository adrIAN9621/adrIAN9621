<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 72" role="img" aria-label="Carpatica Feroviar România SA">
  <defs>
    <linearGradient id="lfRing" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b4f8a"/><stop offset=".55" stop-color="#0b5bb5"/><stop offset="1" stop-color="#36d1dc"/>
    </linearGradient>
    <linearGradient id="lfPeaks" x1="18" y1="24" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36d1dc"/><stop offset="1" stop-color="#0b5bb5"/>
    </linearGradient>
    <linearGradient id="lfWord" x1="80" y1="10" x2="300" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f77c9"/><stop offset=".6" stop-color="#2f93d6"/><stop offset="1" stop-color="#36d1dc"/>
    </linearGradient>
    <filter id="lfGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lfBar"><rect x="86" y="46" width="214" height="17" rx="4"/></clipPath>
    <style>
      .lf-ring{stroke:url(#lfRing);stroke-width:6;stroke-linecap:round;fill:none;filter:url(#lfGlow);
        stroke-dasharray:100;stroke-dashoffset:100;animation:lfDraw 1.5s ease-out .15s forwards, lfPulse 4.5s ease-in-out 1.8s infinite;}
      .lf-peak{fill:url(#lfPeaks);opacity:0;animation:lfFade .7s ease-out 1.1s forwards;}
      .lf-word{font:800 29px/1 "Segoe UI",Arial,sans-serif;letter-spacing:1.3px;fill:url(#lfWord);opacity:0;animation:lfSlide .7s ease-out .5s forwards;}
      .lf-sub{font:700 11px/1 "Segoe UI",Arial,sans-serif;letter-spacing:3.4px;fill:#fff;stroke:#0b2238;stroke-width:2.4px;paint-order:stroke;stroke-linejoin:round;opacity:0;animation:lfFade .7s ease-out 1s forwards;}
      @keyframes lfDraw{to{stroke-dashoffset:0;}}
      @keyframes lfFade{to{opacity:1;}}
      @keyframes lfSlide{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
      @keyframes lfPulse{0%,100%{filter:url(#lfGlow);}50%{filter:url(#lfGlow) brightness(1.18);}}
      @media (prefers-reduced-motion: reduce){.lf-ring{animation:none;stroke-dashoffset:0;}.lf-peak,.lf-word,.lf-sub{animation:none;opacity:1;transform:none;}}
    </style>
  </defs>
  <g transform="translate(4,4) scale(0.92)">
    <path class="lf-ring" pathLength="100" d="M50.4 16.6 A24 24 0 1 0 50.4 47.4"/>
    <path class="lf-peak" d="M17 42 L27 26 L34 36 L41 24 L50 42 Z"/>
    <circle cx="54.5" cy="32" r="2.4" fill="#f2a900"/>
  </g>
  <text class="lf-word" x="86" y="36">CARPATICA</text>
  <g clip-path="url(#lfBar)">
    <rect x="86" y="46" width="72" height="17" fill="#002b7f"/>
    <rect x="158" y="46" width="71" height="17" fill="#fcd116"/>
    <rect x="229" y="46" width="71" height="17" fill="#ce1126"/>
  </g>
  <text class="lf-sub" x="193" y="58.5" text-anchor="middle">FEROVIAR ROMÂNIA</text>
</svg>
