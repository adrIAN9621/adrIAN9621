<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Carpatica Feroviar">
  <defs>
    <linearGradient id="cfRing" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b4f8a"/>
      <stop offset=".55" stop-color="#0b5bb5"/>
      <stop offset="1" stop-color="#36d1dc"/>
    </linearGradient>
    <linearGradient id="cfPeaks" x1="18" y1="24" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36d1dc"/>
      <stop offset="1" stop-color="#0b5bb5"/>
    </linearGradient>
    <filter id="cfGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .cf-ring{stroke:url(#cfRing);stroke-width:6;stroke-linecap:round;fill:none;
        filter:url(#cfGlow);stroke-dasharray:100;stroke-dashoffset:100;
        animation:cfDraw 1.5s ease-out .15s forwards, cfPulse 4.5s ease-in-out 1.8s infinite;}
      .cf-peak{fill:url(#cfPeaks);opacity:0;animation:cfFade .7s ease-out 1.1s forwards;}
      .cf-snow{fill:#eaf6ff;opacity:0;animation:cfFade .7s ease-out 1.3s forwards;}
      @keyframes cfDraw{to{stroke-dashoffset:0;}}
      @keyframes cfFade{to{opacity:1;}}
      @keyframes cfPulse{0%,100%{filter:url(#cfGlow);}50%{filter:url(#cfGlow) brightness(1.18);}}
      @media (prefers-reduced-motion: reduce){
        .cf-ring{animation:none;stroke-dashoffset:0;}
        .cf-peak,.cf-snow{animation:none;opacity:1;}
      }
    </style>
  </defs>
  <path class="cf-ring" pathLength="100" d="M50.4 16.6 A24 24 0 1 0 50.4 47.4"/>
  <path class="cf-peak" d="M17 42 L27 26 L34 36 L41 24 L50 42 Z"/>
  <path class="cf-snow" d="M24.7 30.4 L27 26 L29.6 30 L28 31 L27 30 L26 31 Z M38.2 28.3 L41 24 L43.8 28.2 L42 29 L41 28 L40 29 Z"/>
  <circle cx="54.5" cy="32" r="2.4" fill="#f2a900"/>
</svg>
